<script>/* Motor estatístico independente: nenhuma conexão ou biblioteca externa. */
const S = (() => {
  const sum = a => a.reduce((s,x)=>s+x,0), mean=a=>sum(a)/a.length;

  const unique=a=>[...new Set(a)].sort((a,b)=>String(a).localeCompare(String(b),'pt-BR',{numeric:true}));
  const group=(rows,keys)=>{
    const m=new Map();
    rows.forEach(r=>{const key=JSON.stringify(keys.map(k=>r[k]));if(!m.has(key))m.set(key,[]);m.get(key).push(r);});
    return [...m.values()].map(rs=>({rows:rs,labels:keys.map(k=>rs[0][k]),n:rs.length,total:sum(rs.map(r=>r.y)),mean:mean(rs.map(r=>r.y))}));
  };
  function logGamma(z){

    if(z<.5)return Math.log(Math.PI)-Math.log(Math.sin(Math.PI*z))-logGamma(1-z);
    z--;let x=.9999999999998099;for(let i=0;i<p.length;i++)x+=p[i]/(z+i+1);
    const t=z+p.length-.5;return .9189385332046727+(z+.5)*Math.log(t)-t+Math.log(x);
  }
  function betacf(a,b,x){
    const tiny=1e-300, eps=2e-14;let c=1,d=1-(a+b)*x/(a+1);if(Math.abs(d)<tiny)d=tiny;d=1/d;let h=d;
    for(let m=1;m<401;m++){
      let aa=m*(b-m)*x/((a+2*m-1)*(a+2*m));d=1+aa*d;if(Math.abs(d)<tiny)d=tiny;c=1+aa/c;if(Math.abs(c)<tiny)c=tiny;d=1/d;h*=d*c;
      aa=-(a+m)*(a+b+m)*x/((a+2*m)*(a+2*m+1));d=1+aa*d;if(Math.abs(d)<tiny)d=tiny;c=1+aa/c;if(Math.abs(c)<tiny)c=tiny;d=1/d;const delta=d*c;h*=delta;if(Math.abs(delta-1)<eps)break;

  function norminv(p){

 function latin(raw,cfg,alpha){

   steps:[

function formulas(){
 const glossary=[['N','Número total de observações. Não confunda subamostras com unidades independentes.'],['C','Correção: (Σy)²/N. Serve para centralizar as somas de quadrados.'],['SQ','Soma de quadrados: quantidade de variação atribuída a uma fonte. SQT = Σ(y−ȳ)².'],['gl','Graus de liberdade: número de informações independentes associado a uma fonte.'],['QM','Quadrado médio: SQ/gl. O denominador do teste F depende do delineamento.'],['F','Razão entre o QM do efeito e o QM apropriado de comparação. Sob H₀, compare com F(1−α; gl₁; gl₂).'],['p','Probabilidade, sob H₀ e o modelo, de obter estatística tão ou mais extrema. Não é a probabilidade de H₀ ser verdadeira.'],['α','Nível de significância escolhido antes da análise. p < α leva à rejeição de H₀.'],['R²','Proporção da variação observada explicada pelo ajuste com intercepto: 1 − SQres/SQT. R² alto não prova adequação.'],['QMR','QM residual. Em hierárquicos e parcelas subdivididas, mais de um QM pode servir como denominador.'],['q','Quantil da amplitude studentizada. Tukey: d.m.s. = q·√(QM/n), para médias com igual n.'],['ε','Erro aleatório. Os testes pressupõem a estrutura de independência, variância e distribuição especificada no modelo.']];
 $('main').innerHTML=pageHead('REFERÊNCIA DE ESTUDO','Fórmulas com significado.','Consulte a notação e o caminho de resolução sem perder de vista a pergunta do experimento.')+`<div class="theory"><div class="note"><strong>Sequência usada nas apostilas:</strong> identificar o modelo → calcular graus de liberdade → obter C e SQs → dividir por gl → formar F com o denominador correto → comparar com F crítico → concluir → desdobrar quando necessário.</div><dl class="glossary">${glossary.map(([term,def])=>`<dt>${term}</dt><dd>${def}</dd>`).join('')}</dl><div class="section-head"><h2>O denominador muda a resposta</h2></div>${table(['Modelo / efeito','Denominador do teste F'],[['Quadrado latino · tratamento, linha, coluna','QM resíduo'],['Hierárquico · A, quando B(A) é aleatório','QM B(A)'],['Hierárquico · A, quando B(A) é fixo (restrição soma zero)','QM resíduo'],['Hierárquico · B(A)','QM resíduo'],['Parcelas subdivididas · A e blocos','QM erro(a)'],['Parcelas subdivididas · B e A×B','QM erro(b)'],['Fatorial de efeitos fixos · efeitos e interações','QM resíduo'],['Regressão com repetições · formato do capítulo 2','QM erro puro'],['Regressão sem repetições / superfície de resposta','QM resíduo do ajuste'],['Falta de ajuste','QM erro puro']])}<div class="section-head"><h2>Comparações múltiplas</h2></div><div class="formula">Tukey: d.m.s. = q(1−α; k; ν)·√(QM/n)<br>Tukey–Kramer (n diferentes): d.m.s.ᵢⱼ = q·√[QM/2 · (1/nᵢ + 1/nⱼ)]<br>Duncan: αᵣ = 1 − (1−α)ʳ⁻¹; Rᵣ = q(1−αᵣ; r; ν)·√(QM/n)<br>r é o número de posições abrangidas pelas duas médias na ordenação.</div><p>Escolha a família antes de interpretar letras. Em uma interação, comparar B dentro de A pode ser mais informativo do que comparar médias marginais. No modelo hierárquico, tratamentos aleatórios são estudados por componentes de variância.</p><div class="section-head"><h2>Modelos do material</h2></div>${MODULES.map(m=>`<div class="panel panel-pad" style="margin-bottom:13px"><div class="flex between"><h3>${m.title}</h3><button class="text-btn" data-nav="${m.id}">Abrir ferramenta</button></div><div class="formula">${m.formula}</div><p style="font-size:12px">${m.conditions}</p></div>`).join('')}<div class="section-head"><h2>Como os cálculos são feitos</h2></div><p>As probabilidades F são obtidas pela beta incompleta regularizada; os críticos F e t por inversão numérica. O quantil q é obtido integrando a distribuição da amplitude de normais sobre a raiz de uma qui-quadrado, e invertendo sua distribuição. Os ajustes usam QR com reortogonalização. Não há conexão com serviços externos.</p><p>As casas decimais controlam somente a exibição. Os quantis q são aproximações numéricas; em configurações extremas ou muito diferentes das apostilas, confira com um programa estatístico. O módulo hierárquico adota restrições de soma zero para secundários fixos e explica os quadrados médios esperados.</p></div>`+footer();
}

function generatePlan(){

async function importFile(file){
 if(!file)return;try{const content=await file.text();if(file.name.toLowerCase().endsWith('.json')){
  const p=JSON.parse(content);S.assert(p.format==='experimento'&&MODULES.some(m=>m.id===p.module)&&typeof p.data==='string','Selecione um JSON salvo por este laboratório.');

 }else{
  const lines=content.replace(/^\uFEFF/,'').split(/\r?\n/).filter(s=>s.trim());
  if(lines[0]?.startsWith('Ordem padrao;')&&lines[0].endsWith(';Y')){
   const first=lines.shift().split(';');const fields=lines.map(line=>line.split(';').slice(4));if(fields.some(row=>!row[row.length-1]?.trim()))throw Error('A planilha gerada ainda tem respostas Y vazias. Preencha Y de cada execução antes de importar.');$('data-input').value=fields.map(row=>row.join(';')).join('\n');
  }else $('data-input').value=content;
  $('edit-grid').classList.add('hidden');markDirty();toast('Dados importados. Clique em Atualizar resolução.');
 }
 }catch(e){$('input-error').textContent=e.message;$('input-error').classList.remove('hidden');}
}
function searchGlobal(){const q=normSearch($('global-search').value.trim());if(q.length<2){$('search-results').classList.add('hidden');return;}const hits=[...MODULES.map(m=>({title:m.title,sub:'Calculadora · '+m.chapter,index:m.description+' '+m.sub+' '+m.conditions,route:m.id})),...EXAMPLES.map(e=>({title:e.title,sub:e.tag+' · '+MODULES.find(m=>m.id===e.module).title,index:e.question,route:e.module+'/'+e.id})),...CONCEPTS.map(e=>({title:e.title,sub:e.tag,route:'conceito/'+e.id}))].filter(h=>normSearch(h.title+' '+h.sub+' '+(h.index||'')).includes(q));$('search-results').innerHTML=hits.length?hits.slice(0,12).map(h=>`<button class="search-hit" data-nav="${h.route}">${esc(h.title)}<small>${esc(h.sub)}</small></button>`).join(''):'<div class="search-hit">Nenhum resultado. Tente “adubação”, “Duncan” ou “regressão”.</div>';$('search-results').classList.remove('hidden');}
function renderRoute(){
 const [route,id]=(location.hash.slice(1)||'inicio').split('/');state.module=null;state.report=null;$('sidebar').classList.remove('open');$('shade').classList.remove('open');
 const m=MODULES.find(m=>m.id===route);let title='Visão geral';
 if(m){title=m.title;renderModule(route,id);}else if(route==='exercicios'){title='Exercícios resolvidos';library();}else if(route==='conceito'){title='Questão de planejamento';concept(id);}else if(route==='guia'){title='Qual método usar?';guide();}else if(route==='formulas'){title='Fórmulas e conceitos';formulas();}else if(route==='fontes'){title='Seus PDFs';sources();}else if(route==='planejar'){title='Criar um planejamento';planner();}else home();
 $('breadcrumb').textContent=title;document.title=title+' · Experimento';document.querySelectorAll('.nav [data-nav]').forEach(button=>button.classList.toggle('active',button.dataset.nav===route||(route==='conceito'&&button.dataset.nav==='exercicios')));window.scrollTo({top:0,behavior:'instant'});
}
document.addEventListener('click',event=>{
 const b=event.target.closest('[data-nav],[data-tab],button');if(!b)return;
 if(b.dataset.nav){save();go(b.dataset.nav);return;}if(b.dataset.tab){showTab(b.dataset.tab);return;}
 const id=b.id;
 if(id==='menu-toggle'){$('sidebar').classList.toggle('open');$('shade').classList.toggle('open');}
 else if(id==='solve')solve();else if(id==='restore-example')renderModule(state.module,state.example.id);else if(id==='edit-data')editGrid();else if(id==='predict')updatePrediction();
 else if(id==='toggle-steps'){const steps=[...document.querySelectorAll('#pane-steps .step')],open=!steps.every(s=>s.open);steps.forEach(s=>s.open=open);b.textContent=open?'Recolher etapas':'Expandir etapas';}
 else if(id==='save-analysis')saveAnalysis();else if(id==='export-csv')csvData();else if(id==='download-report')exportReport();else if(id==='print-report'){if(ensureFresh()){document.querySelectorAll('#analysis-output details').forEach(s=>s.open=true);window.print();}}
 else if(id==='generate-plan')generatePlan();else if(id==='download-plan')download('planejamento-experimental.csv','\uFEFF'+generatedPlan,'text/csv;charset=utf-8');
});
document.addEventListener('input',event=>{
 const el=event.target;
 if(el.id==='global-search')searchGlobal();else if(el.id==='exercise-search')filterLibrary();else if(el.id==='data-input'){if($('edit-grid'))$('edit-grid').classList.add('hidden');markDirty();}
 else if(el.dataset.cell){const host=$('edit-grid'),cells=JSON.parse(host.dataset.cells),[i,j]=el.dataset.cell.split(',').map(Number);cells[i][j]=el.value;host.dataset.cells=JSON.stringify(cells);$('data-input').value=cells.map(r=>r.join('; ')).join('\n');markDirty();}
 else if(el.matches('[data-setting]')&&state.module&&!el.id.startsWith('post-')&&!el.id.startsWith('prediction-'))markDirty();
});
document.addEventListener('change',event=>{
 const el=event.target;
 if(el.id==='example-select')renderModule(state.module,el.value);
 else if(el.id==='library-filter')filterLibrary();else if(el.id==='post-family'||el.id==='post-method')renderPosthoc();
 else if(el.id==='plot-slice')$('interaction-plot').innerHTML=Charts.interaction(state.report.plot,el.value);
 else if(el.id==='import-file')importFile(el.files[0]);
 else if(el.id==='plan-type'){if(el.value==='ccd'){$('plan-centers').value=3;$('plan-reps').value=1;$('plan-name0').value='Concentração';$('plan-low0').value=25;$('plan-high0').value=35;$('plan-name1').value='Velocidade';$('plan-low1').value=80;$('plan-high1').value=110;}plannerFactors();}
 else if(el.id==='plan-k')plannerFactors();
 else if(el.matches('[data-setting]')&&state.module&&!el.id.startsWith('prediction-')){try{refreshSchema();markDirty();}catch{markDirty();}}
});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){$('sidebar').classList.remove('open');$('shade').classList.remove('open');$('search-results').classList.add('hidden');}if(event.key==='Enter'&&['prediction-x','prediction-v'].includes(event.target.id)){event.preventDefault();updatePrediction();}if((event.ctrlKey||event.metaKey)&&event.key==='Enter'&&state.module)solve();});
document.addEventListener('click',event=>{if(!event.target.closest('.searchbox,.search-popover'))$('search-results').classList.add('hidden');});
$('shade').addEventListener('click',()=>{$('sidebar').classList.remove('open');$('shade').classList.remove('open');});
window.addEventListener('hashchange',renderRoute);window.addEventListener('beforeunload',save);
$('module-nav').innerHTML=MODULES.map(m=>`<button data-nav="${m.id}">${icon(m.icon)}${m.title}<span class="nav-no">${m.no}</span></button>`).join('');
renderRoute();
</script>
</body>
</html>
